# Regenerate the proxy reference in the docs repo when a contract changes.
#
# The contracts live here, so the reference published from them is this repo's job to keep
# current. It used to be the controller's: a private repository rendering a public contract,
# which meant the docs could only be regenerated by somebody with access to code that has
# nothing to do with them — and in practice meant they were regenerated by hand, when
# somebody remembered.
#
# The output is committed to the docs repo rather than generated during its build. That repo
# builds a Docusaurus site from `content/`, so the markdown has to be there, and a checked-in
# copy is also what makes a contract change show up as a reviewable diff of the reference.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'proxies/**'
      - 'src/proxy/docgen.rs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Two contract changes landing together must not race to be the published reference. The
# older loses, which is right: the newer run regenerates from a tree that contains both.
concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A deploy key rather than the run's own token: docs is a separate, private repository,
      # so `GITHUB_TOKEN` cannot write to it. A key beats a PAT here because it grants write
      # to exactly one repository and belongs to no person — and pushing with either fires the
      # docs repo's own deploy workflow, which a `GITHUB_TOKEN` push would not, leaving the
      # reference regenerated but unpublished.
      - uses: actions/checkout@v5
        with:
          repository: junohouse/docs
          path: docs
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo run --quiet --features pack --bin junodrv -- docs --out docs/content/proxies

      # `git add <dir>` stages deletions too, so a contract that is removed takes its page
      # with it instead of leaving a reference to a device class that no longer exists.
      - name: Commit
        working-directory: docs
        run: |
          git config user.name  'juno-docs-bot'
          git config user.email 'bot@juno.house'
          git add content/proxies
          if git diff --cached --quiet; then
            echo 'proxy reference unchanged'
            exit 0
          fi
          git commit -q -m "Regenerate the proxy reference (driver-sdk ${GITHUB_SHA:0:7})"
          git push -q
