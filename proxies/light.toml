name = "light"
title = "Light"
category = "lighting"
description = "A controllable light load — switched, dimmed, tunable, or full color."

[capabilities]
dimmer                = { type = "bool", default = false, doc = "Supports levels between off and on" }
supports_color        = { type = "bool", default = false, doc = "Full hue/saturation color" }
supports_cct          = { type = "bool", default = false, doc = "Tunable correlated color temperature" }
cct_min               = { type = "u32",  default = 2700 }
cct_max               = { type = "u32",  default = 6500 }
# Gates the `ramp_ms` on every command here, and the hold-to-dim pair. A driver that leaves it
# false is saying the hardware fades on its own schedule, so nothing offers a fade time it
# cannot carry.
supports_ramp         = { type = "bool", default = false, doc = "Honours a ramp time on level changes" }
ramp_rate_max_ms      = { type = "u32",  default = 0,     doc = "Longest fade the hardware accepts" }
supports_target       = { type = "bool", default = false, doc = "Can be told to ramp toward a level over time and report progress" }
min_on_level          = { type = "u8",   default = 1,   doc = "Lowest level the load will hold without flicker" }
max_on_level          = { type = "u8",   default = 100 }
has_button_events     = { type = "bool", default = false, doc = "Physical keypad on the load reports presses" }
load_group_support    = { type = "bool", default = false, doc = "Can join a synchronised group at the device level" }

[commands.on]
title = "Turn on"
[commands.off]
title = "Turn off"
[commands.toggle]
title = "Toggle"

[commands.set_level]
title = "Set brightness"
doc = "Set brightness. 0 is off."
requires = "dimmer"
params.level   = { type = "u8",  min = 0, max = 100 }
params.ramp_ms = { type = "u32", optional = true, requires = "supports_ramp", doc = "Fade time" }

# Gated on `supports_ramp` rather than on `dimmer`: plenty of switches dim in one jump and
# have no "go up until I say stop" — a Tapo dimmer answers both of these with a warning, and
# a pair of buttons that can only fail is worse than no buttons at all.
[commands.ramp_start]
title = "Start dimming"
doc = "Begin ramping in a direction until stopped — for held keypad buttons"
requires = "supports_ramp"
params.direction = { type = "string", values = ["up", "down"] }

[commands.ramp_stop]
title = "Stop dimming"
requires = "supports_ramp"

[commands.set_color]
title = "Set color"
requires = "supports_color"
params.hue     = { type = "f32", min = 0.0, max = 360.0 }
params.sat     = { type = "f32", min = 0.0, max = 100.0 }
params.ramp_ms = { type = "u32", optional = true, requires = "supports_ramp", doc = "Fade time" }

[commands.set_cct]
title = "Set color temperature"
requires = "supports_cct"
params.kelvin  = { type = "u32", min = 1000, max = 10000, min_cap = "cct_min", max_cap = "cct_max" }
params.ramp_ms = { type = "u32", optional = true, requires = "supports_ramp", doc = "Fade time" }

[notifications.level_changed]
title = "Brightness changed"
doc = "Settled at a level"
params.level = { type = "u8", min = 0, max = 100 }

[notifications.level_changing]
title = "Brightness changing"
doc = "Mid-ramp progress. Rate-limited by the driver; core does not persist these."
params.level = { type = "u8", min = 0, max = 100 }

[notifications.color_changed]
title = "Color changed"
requires = "supports_color"
params.hue = { type = "f32" }
params.sat = { type = "f32" }

[notifications.cct_changed]
title = "Color temperature changed"
requires = "supports_cct"
params.kelvin = { type = "u32" }

[notifications.button_action]
title = "Button pressed"
requires = "has_button_events"
params.button = { type = "string" }
params.action = { type = "string", values = ["press", "release", "click", "double", "hold"] }

[notifications.online_changed]
title = "Reachability changed"
params.online = { type = "bool" }

# For hardware that reports power separately from brightness. Sending this once tells core to
# stop inferring `on` from `level` for that device — so a driver reports both from then on, and
# must not send a level that contradicts the power it last stated.
[notifications.power_changed]
title = "Turned on or off"
params.on = { type = "bool" }

[state]
level  = { title = "Brightness", type = "u8" }
# A light is on when its level is above zero — *unless* the driver says otherwise. Core derives
# this from `level` so that a driver which cannot separate the two never has to, and so a rule,
# a tile and the suggestion miner all mean the same thing by "the light is on".
#
# It is a fallback, not a rule. Plenty of hardware keeps the two genuinely apart: a Hue bulb
# holds the brightness it will return to while it is off, so "brightness 47, off" is a real
# state and inferring power from level cannot express it. A driver that knows reports
# `power_changed`, and from then on core stops deriving this key for that device and takes the
# driver's word — see `Runtime::derive_state`.
on     = { title = "On", type = "bool", truthy_of = "level" }
hue    = { title = "Hue", type = "f32" }
sat    = { title = "Saturation", type = "f32" }
kelvin = { title = "Color temperature", type = "u32" }
online = { title = "Reachable", type = "bool" }
