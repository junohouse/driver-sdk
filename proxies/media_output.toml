name = "media_output"
title = "Media output"
category = "av"
description = """
Somewhere the house can hand a stream of audio to and have it come out in a room: the Pi behind a
television, a Juno speaker with an amplifier in it, a player belonging to a media server.

The mirror of `media_player`, and the two are not the same thing said twice. A media player
*originates* content — it is a source, and a room's `listen` names one. This is where sound ends
up. It chooses nothing, browses nothing and knows nothing about what it is playing; somebody
upstream decided, and this is the last hop.

**Why a separate proxy rather than capabilities on the device that has one.** Every output in a
house belongs to something that is already a device for other reasons — the Pi is a `navigator`,
the Juno speaker is a `voice_speaker`, a soundbar is a `tv`'s neighbour. Putting `has_mixing` on
each of those means the same four capabilities written five times and drifting apart, and it means
a room looking for somewhere to put a voice reply has to know all five contracts. One proxy is one
question: which bindings in this room can be given audio, and what happens to what is already
playing when they are.

**It carries no audio.** Nothing here moves a byte. The same reasoning as `voice_speaker`'s
`set_route`: whether audio reaches an output as PCM over a socket, as a URL it fetches, or as
something not invented yet is the switching layer's business, and a contract that named a
transport would have to change every time that did. What this contract does say is *where* to
reach it — `endpoint`, below, which the driver fills in because the thing serving the audio is the
only party that knows how it is reachable.

# Voice, and what happens to the music

The case this exists for is a reply arriving while something is already playing. Three things can
happen, and which of them is *possible* is a fact about the hardware:

- **Switching** — one audio slot. The media has to stop for the voice to be heard, and start again
  afterwards. Anything with `has_mixing = false`.
- **Mixing** — two slots. Voice can sound over the media, so the media can either duck under it or
  be paused anyway. `has_mixing = true`, and which of the two happens is a decision somebody makes
  per output, not something the device decides.

Ducking is not always the kinder option, which is why it is a choice rather than a default: under
a film at volume, a ducked track is still loud enough to bury a short answer, and a pause that
resumes cleanly is less annoying than an answer nobody could make out.
"""

[capabilities]
# What this output is willing to be given. Both default true because an output that plays neither
# is not one — but they come apart in practice: an announcement-only ceiling speaker plays no
# media, and a media player with no voice path plays no speech.
has_media = { type = "bool", default = true, doc = "A media stream can be played here" }
has_voice = { type = "bool", default = true, doc = "Voice replies and announcements can be played here" }

# Whether voice and media can sound at the same time. False means switching: whatever is playing
# has to stop first. See the note above — this is the hardware's answer, not the installer's.
has_mixing = { type = "bool", default = false, doc = "Voice and media can sound at once" }

# Whether the media stream can genuinely be paused and resumed where it left off, as opposed to
# only being silenced. A stream is not a file: an internet radio station that is "paused" for four
# seconds and resumed has moved on four seconds, and pretending otherwise is worse than ducking.
has_pause = { type = "bool", default = false, doc = "Media playing here can be paused and resumed in place" }

has_volume = { type = "bool", default = false }
volume_max = { type = "u32", default = 100 }
has_mute = { type = "bool", default = false }

# Which sources this output can be fed from, comma separated: `url,spotify,airplay`.
#
# A capability rather than a command's parameter list because it is a fact about the software on
# that box, and it is what a house intersects its services against — a `media_service` naming a
# protocol nothing can host is a service that should not be offered anywhere rather than one that
# fails when somebody presses play.
#
# `url` is the plain case this contract was written for: `play`, above. The others are daemons the
# box runs, driven from somebody's phone rather than from here — see `media_service`.
services = { type = "string", default = "url", doc = "Comma-separated protocols this output can host" }

[commands.play]
title = "Play something"
requires = "has_media"
doc = """
Fetch this and play it. The whole of what an output needs to be told.

**A URL, not audio.** The controller never carries a byte of it — a continuous stream through the
one process the house depends on is the thing every other part of this design goes out of its way
to avoid, and it would put the controller between a media server and a speaker for no benefit. The
output fetches for itself, which also means a source too big or too fast for the controller's link
is not thereby too big for the house.

**`at` is what makes several rooms one room.** An empty `at` means "as soon as you can", which is
right for one output. Given a moment, the output prepares and waits for it — so a controller
handing three outputs the same URL and the same instant gets three rooms that start together
instead of three rooms a second apart, which in an open-plan floor is worse than one room.

RFC 3339, with milliseconds, in UTC. A wall clock rather than a countdown because a countdown is
wrong by however long the request took, and that is exactly the error being removed. Everything in
a house runs NTP; an output whose clock is wrong will start at the wrong time and is worth fixing
rather than working around.

The metadata is for whatever is drawing a screen in that room. Optional in the honest sense — a
stream that has no title has none, and inventing "Unknown Artist" is a decision for whoever draws
it rather than for the thing playing it.
"""
params.url = { type = "string" }
params.at = { type = "string", optional = true, doc = "RFC 3339 instant to start at. Empty means now." }
params.title = { type = "string", optional = true }
params.artist = { type = "string", optional = true }
params.artwork = { type = "string", optional = true, doc = "URL of cover art" }

[commands.pause]
title = "Pause"
requires = "has_pause"
doc = """
Stop playing and keep the place. See `has_pause` for why not every output has this: a stream is
not a file, and an internet radio station that is paused for four seconds and resumed has moved on
four seconds.
"""

[commands.resume]
title = "Resume"
requires = "has_pause"
doc = "Carry on from where `pause` stopped."

[commands.stop]
title = "Stop"
doc = "Stop whatever is playing here. Does not turn anything off — an output is not a device."

[commands.set_services]
title = "Which services to host"
doc = """
Run these, stop anything else, and advertise them under this name.

The whole list every time, never a delta. The same bargain `HostCall::Connections` makes and for
the same reason: after a restart, a reconnect or a controller that was replaced, one message says
what should be true and there is no resync path to get wrong. An empty list means host nothing,
which is how a room is taken out of the Spotify picker.

`name` is what somebody sees when they open the Spotify or AirPlay menu on their phone, so it
should be the name of the *room* rather than of the box — nobody picking a speaker from a sofa
knows which Pi is behind which television. Empty leaves it to the output, which will use whatever
it calls itself.

Anything in `services` that this output did not declare it can host is ignored rather than
refused: a controller that has learned about a protocol before the box has is a controller in the
middle of an upgrade, and it should not take the working half down.
"""
params.services = { type = "string", doc = "Comma separated, from this output's own `services`" }
params.name = { type = "string", optional = true }

[commands.set_volume]
title = "Volume"
requires = "has_volume"
params.level = { type = "u32", min = 0, max_cap = "volume_max" }

[commands.set_mute]
title = "Mute"
requires = "has_mute"
params.mute = { type = "bool" }

[notifications.endpoint_changed]
title = "Delivery address changed"
doc = """
Where audio for this output is to be sent, as the thing serving it understands the question.

Reported rather than derived, and for the reason `voice_speaker`'s `listening_changed` reports one:
whoever holds the audio is the only party that knows where it is reachable, and anything that
guessed would be wrong the first time a house ran two of them. Empty means it cannot currently be
reached, which is a different statement from being offline.
"""
params.endpoint = { type = "string" }

[notifications.playing_changed]
title = "What is sounding changed"
doc = """
Whether media, voice, or both are coming out of this output right now.

Two booleans rather than one state word because on a mixing output both are true at once, and a
single `playing`/`speaking`/`idle` would have to invent a name for that or lie about it.
"""
params.media = { type = "bool" }
params.voice = { type = "bool" }

[notifications.now_playing_changed]
title = "What is playing changed"
requires = "has_media"
doc = """
What this output is playing now, as it turned out — not as it was asked.

Reported rather than assumed from the command, and the difference is the whole point: a URL that
redirects, a station that names its own current track, a stream whose duration is only known once
the headers arrive. A controller that echoed back what it sent would show the wrong title for
every internet radio station in the world.

An empty `url` means nothing is playing, which is how an output says a track ended or a stream
dropped without anybody having asked it to stop.
"""
params.url = { type = "string" }
params.title = { type = "string", optional = true }
params.artist = { type = "string", optional = true }
params.artwork = { type = "string", optional = true }
params.duration = { type = "u32", optional = true, doc = "Seconds. Absent for a live stream, which has none." }
# Which of the things this output hosts is making the sound. Worth carrying beside the title
# rather than being inferred from it: "Airbag" tells a screen nothing about whether it can offer a
# pause button, and on a pushed service the answer is that somebody else's phone is the remote.
params.source = { type = "string", optional = true, doc = "`url`, `spotify`, `airplay` — empty when nothing is playing" }

[notifications.position_changed]
title = "Position changed"
requires = "has_media"
doc = """
How far into the track this output is, in seconds.

Sent on the edges that matter — a start, a seek, a pause — rather than every second. A progress bar
wants a number and a clock, not a stream of numbers: whoever is drawing one has the wall clock
already and can move the bar itself between reports, and a house with six outputs in it should not
be sending six messages a second to say that time is passing.
"""
params.seconds = { type = "u32" }

[notifications.volume_changed]
title = "Volume changed"
requires = "has_volume"
params.level = { type = "u32" }

[notifications.mute_changed]
title = "Mute changed"
requires = "has_mute"
params.mute = { type = "bool" }

[notifications.online_changed]
title = "Reachability changed"
params.online = { type = "bool" }

[state]
endpoint = { title = "Delivery address", type = "string" }
source   = { title = "Source", type = "string" }
url      = { title = "Playing", type = "string" }
title    = { title = "Title", type = "string" }
artist   = { title = "Artist", type = "string" }
artwork  = { title = "Artwork", type = "string" }
duration = { title = "Length", type = "u32" }
position = { title = "Position", type = "u32", from = "seconds" }
media    = { title = "Playing media", type = "bool" }
voice    = { title = "Speaking", type = "bool" }
volume   = { title = "Volume", type = "u32", from = "level" }
mute     = { title = "Muted", type = "bool" }
online   = { title = "Reachable", type = "bool" }
