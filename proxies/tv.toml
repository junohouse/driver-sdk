name = "tv"
title = "TV"
category = "av"
description = """
A display. Its inputs are `consumer` signal connections declared in the manifest; pathfinding
targets them when a room's video sink is this device.
"""

[capabilities]
is_video_sink       = { type = "bool", default = true,  doc = "The room's picture can end at this binding. Displays opt in; sources such as media players and navigators do not." }
has_discrete_power  = { type = "bool", default = false, doc = "Separate on and off commands, not just a toggle" }
has_discrete_input  = { type = "bool", default = false, doc = "Can select an input directly rather than cycling" }
has_discrete_volume = { type = "bool", default = false, doc = "Can be set to an absolute volume" }
has_discrete_mute   = { type = "bool", default = false }
has_volume          = { type = "bool", default = true }
has_channel_control = { type = "bool", default = false, doc = "Built-in tuner" }
volume_max          = { type = "u32",  default = 100 }
has_hold            = { type = "bool", default = false, doc = """
Volume can be held down and released, rather than only stepped. See `hold`.

A screen on an emitter can ramp; the same screen reached over HTTP one request at a time
cannot, however many volume keys it has.
""" }
warmup_ms           = { type = "u32",  default = 0, doc = "Time after power-on before it will accept an input change. Pathfinding respects this." }
cooldown_ms         = { type = "u32",  default = 0 }
supports_arc        = { type = "bool", default = false }

[commands.on]
[commands.off]
[commands.power_toggle]

[commands.set_input]
doc = "Select the input carrying a given signal connection. Issued by the pathfinder, not usually by a person."
params.connection = { type = "u32", values_from = "connections", doc = "Signal connection id. The choices are the inputs this set reported, not the ones the manifest guessed." }

[commands.pulse_input]
doc = "Cycle to the next input. The fallback when has_discrete_input is false."

[commands.set_volume]
requires = "has_discrete_volume"
params.level = { type = "u32", min = 0, max = 100 }

[commands.volume_up]
requires = "has_volume"
[commands.volume_down]
requires = "has_volume"

[commands.set_mute]
requires = "has_discrete_mute"
params.mute = { type = "bool" }

[commands.mute_toggle]
requires = "has_volume"

[commands.hold]
doc = """
Begin holding a key, and keep holding it until `release`. The difference between a step and a
ramp — see the same pair on `media_player`, which this mirrors so a room does not have to care
which of the two is carrying its volume.
"""
requires = "has_hold"
params.what = { type = "string", values = ["volume_up", "volume_down"], values_require = { volume_up = "has_volume", volume_down = "has_volume" } }

[commands.release]
doc = "Stop holding. Takes no argument: one key is held at a time."
requires = "has_hold"

[commands.set_channel]
requires = "has_channel_control"
params.channel = { type = "string" }

[notifications.power_changed]
params.on = { type = "bool" }

[notifications.input_changed]
params.connection = { type = "u32" }

[notifications.volume_changed]
params.level = { type = "u32" }

[notifications.mute_changed]
params.mute = { type = "bool" }

[notifications.online_changed]
params.online = { type = "bool" }

[notifications.source_changed]
doc = """
The set moved to one of its own sources, or off one. `source` is empty when it is on a jack.

Separate from `input_changed` because these are not connections and must never be treated as
some: nothing is wired to AirPlay, nothing can be routed through it, and a pathfinder handed one
as a jack would solve a path to a socket that does not exist.
"""
params.source = { type = "string" }

[state]
on         = { type = "bool" }
connection = { type = "u32" }
# The set's own sources — AirPlay, a built-in free-TV app — and which one it is on.
#
# Not connections, and kept out of `connection` for that reason: a jack is something an
# installer wires a box into and the pathfinder solves through, and none of these is. What they
# are is real, visible on the set's own input list, and worth showing beside the jacks on a
# control surface — a television sitting on AirPlay should say so rather than looking like it is
# on nothing.
#
# A house cannot select one. There is no command here to do it and that is deliberate: a phone
# puts a television on AirPlay, and offering a button for it would be a control that reaches
# nothing. See `input.toml` for the same argument about a whole contract.
built_in_sources = { type = "string_list", doc = "The set's own sources, by the names it shows." }
source           = { type = "string", from = "source", doc = "Which of them it is on. Empty on a jack." }
volume     = { type = "u32", from = "level" }
# `has_volume` rather than `has_discrete_mute`: a set with only a mute *toggle* still has a mute
# state, and `mute_toggle` is what that capability gates. Defaults true, so an ordinary
# television keeps it — the screen is the half of a smart TV that really can be muted.
mute       = { type = "bool", requires = "has_volume" }
online     = { type = "bool" }
