name = "bridge"
title = "Bridge"
category = "system"
description = """
A hub that other devices live behind — a Hue bridge, a Lutron processor, a Zigbee coordinator.

It is a device in its own right so that the things every child needs — an address, a paired
key, a connection — are held in one place. Change the bridge's IP once and every bulb behind
it follows; without this each bulb would carry its own copy and they would drift the first
time a router handed out a new lease.

A bridge has no commands. It is not something anyone points a remote at.
"""

[capabilities]
child_driver = { type = "string", default = "", doc = "Driver id of the devices that live behind this bridge" }
max_children = { type = "u32", default = 0, doc = "0 means no stated limit" }

[notifications.online_changed]
params.online = { type = "bool" }

[notifications.child_count_changed]
doc = "How many devices the bridge currently reports."
params.count = { type = "u32" }

# Something was paired to the hub itself, by somebody standing in front of it with the vendor's
# own app. It is not in the project and nobody has said it should be — so this is an offer, not
# an adoption, and core turns it into a prompt rather than a device.
#
# An event and not state on purpose: `count` already says how many children there are, and a
# notification whose parameters all feed state keys would be filed as a repeat rather than kept
# as something that happened. The vendor id is what a later adoption matches on; the name is
# only for the sentence a person reads.
[notifications.device_added]
title = "New device on the hub"
params.id = { type = "string" }
params.name = { type = "string" }
params.kind = { type = "string" }

[state]
online = { type = "bool" }
count  = { type = "u32" }
