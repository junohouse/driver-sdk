name = "navigator"
title = "Navigator"
category = "interface"
description = """
A screen somebody controls the house from: a Juno OSD on a television, a wall panel, a tablet in a
dock. The thing Control4 calls a navigator, and the reason the word is used here rather than
"display" — a television *is* a display and is a different object entirely, one this drives.

It controls; it is not controlled. Nothing in a house asks a navigator to do something, so this
contract has almost no commands: what it is for is being **placed**. A screen in the kitchen
should open on the kitchen, and the only way it can know that is for somebody to have said which
room it is in — which is exactly what putting a device in a room already means everywhere else in
Juno. Nothing new had to be invented for it; a navigator is a device, and devices live in rooms.

The identity is the MAC, in `serial`. Two Pis flashed from one card image are identical in every
other respect — same hostname scheme, same software, same everything — so the burned-in address is
the one thing that distinguishes them, and it is what a room assignment has to survive being keyed
on. Reflash the card and the assignment still holds; swap the SD into a different Pi and it
correctly does not.

There are no commands at all, which is deliberate rather than unfinished — `keypad` is the same
shape for the same reason. A navigator would want an `identify` ("say which one you are, so I can
tell which room I am standing in"), and it is not here because the screen has no control channel
yet to receive one. A contract that claimed it would be a contract that lies.
"""

[capabilities]
has_cec = { type = "bool", default = false, doc = "Can drive a television over HDMI-CEC — power, input, volume. True for a Pi wired into a set's HDMI, false for a tablet." }
# A navigator with a control channel back to it — an OSD a remote drives — rather than a placed
# panel that only reports where it is. This contract was command-less by design; this capability is
# what opts a screen into being driven, so a plain placed panel still validates with no commands.
has_control = { type = "bool", default = false, doc = "Accepts navigation commands over a channel back to the screen. True for an OSD a remote drives; false for a tablet that is only placed." }

# Navigation — a remote's d-pad and its select/back/home/menu keys, routed to whichever screen is
# the room's active video source. Gated by has_control so a placed panel offers none of it. The key
# set mirrors `media_player`'s dpad exactly — all nine keys — so a remote's mapping is the same
# wherever it lands. It drifted once, missing `info`, and the cost of that is invisible: the key
# is bound on the remote, core has somewhere to send it, and it stops at the contract with nothing
# saying why.
[commands.dpad]
title = "Navigate"
requires = "has_control"
params.key = { type = "string", values = ["up", "down", "left", "right", "select", "back", "home", "menu", "info"] }

# Transport, for what the screen itself is showing. A navigator with a control channel is the
# thing being driven — somebody is looking at it and pressing keys at it — so Play belongs to it
# the same way the d-pad does. Gated by has_control alongside the rest, so a placed panel with no
# channel back to it still declares none of this.
[commands.play]
title = "Play"
requires = "has_control"

[commands.pause]
title = "Pause"
requires = "has_control"

[commands.play_pause]
title = "Play or pause"
doc = "One key for both, which is what a remote's transport row actually has."
requires = "has_control"

[commands.stop]
title = "Stop"
requires = "has_control"

[commands.skip_forward]
title = "Skip forward"
requires = "has_control"

[commands.skip_back]
title = "Skip back"
requires = "has_control"

# The screen's CEC link to the television it is plugged into — a *second* way to reach that set,
# separate from the set's own driver. Only the two operations CEC does reliably across brands:
# standby/one-touch-play, and Active Source. Volume is deliberately absent — it is the one CEC
# feature sets disagree about most, and a volume key that works on one television and silently
# does nothing on the next is worse than one that was never offered.
[commands.tv_power]
title = "Power the television"
doc = "One-touch-play to wake the set, or standby to sleep it, over CEC."
requires = "has_cec"
params.on = { type = "bool" }

[commands.tv_select]
title = "Switch the television to this screen"
doc = """
Announce this screen as the Active Source, which is how CEC switches a set to the input a device
is plugged into without anybody knowing which input that is.
"""
requires = "has_cec"

[notifications.online_changed]
title = "Reachability changed"
params.online = { type = "bool" }

[notifications.showing_changed]
title = "What is on screen changed"
doc = "Which room the screen is showing, or nothing when it is on the house view."
params.room = { type = "string" }

[state]
online = { title = "Reachable", type = "bool" }
# Where the screen is, as opposed to what it is showing. Set by placing the device in a room like
# any other; read back by the screen itself so it opens where it lives.
showing = { title = "Showing", type = "string" }
address = { title = "Address", type = "string" }
serial = { title = "MAC", type = "string" }
model = { title = "Model", type = "string" }
