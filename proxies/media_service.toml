name = "media_service"
title = "Media service"
category = "system"
description = """
The server that owns music sources, library, queues and synchronized playback. The project owns
rooms and physical outputs; a media service consumes that configuration and must not import its
own player inventory back into the project.

# Why a service is a device, and why it is structural

Structural rather than `av`, on the same grounds `app_shelf` is: every other contract in that
category is a box with a power cord, and there is nothing here for a virtual driver to pretend to
be. Nobody buys a Spotify Connect, and nobody points a remote at one.

Because everything else somebody configures is one. Adding Music Assistant has the same shape as
adding a bridge — it gets a name, a settings page, a place in the item list and a project that
remembers it. The driver talks to the external service API; provider-specific configuration stays
behind that boundary rather than becoming a second set of Juno service devices.

# The service owns playback; the project owns outputs

Nothing on this contract carries or decodes audio. Core periodically gives the service the exact
set of project `media_output` proxies it may use. The service may keep private protocol players
for those outputs — Sendspin clients in Music Assistant — but those are implementation details,
not new Juno devices. Playback commands name only ids from that synchronized set.

# Pushed or chosen

`is_pushed` still distinguishes a phone-owned receiver, but Music Assistant is driven here and
sets it false. Its provider integrations remain Music Assistant's concern; Juno only selects a
project output and asks the service to act on its queue.
"""

[capabilities]
# The coordinator protocol matched against a `media_output`'s `services` list, for example
# `music_assistant`. It selects an endpoint transport, not a provider inside the service.
protocol = { type = "string", default = "" }

# Whether playback is started from somewhere else. True for anything where a phone is the remote
# and the house is the speaker; see the note above for why it changes what this contract can have.
is_pushed = { type = "bool", default = true }

# Whether one session can drive several outputs at once.
#
# A service that can group its synchronized endpoint transports says so, and a house can then put
# one queue in four rooms.
has_multiroom = { type = "bool", default = false }

[notifications.service_changed]
title = "Service changed"
doc = "What this service is and what it is called, after setup or an edit."
params.protocol = { type = "string" }
params.name = { type = "string", optional = true, doc = "What outputs advertise it as. Empty means each uses its room's name." }

[commands.sync_outputs]
title = "Synchronize project outputs"
doc = """
Replace the service's allowed output set. `outputs` is a JSON array whose entries contain
`player_id`, `binding`, `device`, `name`, and `room`. The ids are service-private routing keys;
the bindings remain the only output objects in the project. An empty array means no output may be
used. This is full desired state, not a delta.
"""
params.outputs = { type = "string", doc = "JSON array of project media-output routes" }

[commands.play]
title = "Play on outputs"
params.outputs = { type = "string", doc = "JSON array of allowed service-private player ids, leader first" }
params.url = { type = "string", doc = "Music Assistant URI or a URL it can resolve" }
params.at = { type = "string", optional = true, doc = "Requested start instant; synchronized services may use their own stream clock" }
params.title = { type = "string", optional = true }
params.artist = { type = "string", optional = true }
params.artwork = { type = "string", optional = true }

[commands.join]
title = "Join outputs"
params.leader = { type = "string" }
params.outputs = { type = "string", doc = "JSON array of outputs to add" }

[commands.leave]
title = "Leave outputs"
params.leader = { type = "string", doc = "Current leader before this change" }
params.remaining = { type = "string", doc = "JSON array of outputs that remain, new leader first" }
params.removed = { type = "string", doc = "JSON array of outputs leaving" }

[commands.pause]
title = "Pause queue"
params.leader = { type = "string" }

[commands.resume]
title = "Resume queue"
params.leader = { type = "string" }

[commands.stop]
title = "Stop queue"
params.leader = { type = "string" }

[notifications.online_changed]
title = "Reachability changed"
params.online = { type = "bool" }

[notifications.outputs_changed]
title = "Allowed outputs changed"
params.outputs = { type = "string", doc = "JSON array of configured output status objects" }

[state]
protocol = { title = "Protocol", type = "string" }
name     = { title = "Name", type = "string" }
online  = { title = "Reachable", type = "bool" }
outputs = { title = "Outputs", type = "string" }
