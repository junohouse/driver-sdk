[package]
name = "driver-sdk"
version = "0.15.1"
edition = "2024"
description = "Write a driver for a Juno controller"
repository = "https://github.com/junohouse/driver-sdk"
license = "MIT OR Apache-2.0"

# Nothing of Juno's. This crate is the contract between a controller and a driver, so it owns
# the types on both sides of it rather than borrowing them from the controller — which is what
# lets a driver be built by anyone, without access to a private repository.
#
# That argument applies to the *contracts* as much as to the types, which is why `proxies/` and
# the manifest format live here too. A driver author who cannot read the proxy contracts cannot
# check their own manifest, and until this moved they needed access to a private repository to
# do it — which made "anyone can build a driver" true only up to the point it mattered.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only for the feature-gated halves. A driver that just implements `DriverModule` compiles
# none of this.
anyhow = { version = "1", optional = true }
semver = { version = "1", optional = true }
toml = { version = "0.9", optional = true }
zip = { version = "6", optional = true, default-features = false, features = ["deflate"] }

# The primitives behind `crypto`. Pure Rust, no OS bindings — the same reason `random_get` is
# the sandbox's own entropy source rather than a system RNG: nothing here can open a file or a
# socket, so nothing here can be a dependency a wasm build refuses to link.
sha1 = { version = "0.10", optional = true, default-features = false }
sha2 = { version = "0.10", optional = true, default-features = false }
aes = { version = "0.8", optional = true, default-features = false }
cbc = { version = "0.1", optional = true, default-features = false, features = ["alloc", "block-padding"] }

[[bin]]
name = "junodrv"
path = "src/bin/junodrv.rs"
required-features = ["pack"]

# `package` only exists behind `pack`, so the test that exercises it only builds behind `pack`.
# Without this, a plain `cargo test` fails to compile a file that could never have worked.
[[test]]
name = "package"
required-features = ["pack"]

# The contracts are only parsed when something loads them, so this is the only thing that
# reads `proxies/*.toml` in the test run. `cargo test` alone compiles no features and would
# skip it silently — CI runs `cargo test --all-features`.
[[test]]
name = "proxies"
required-features = ["contracts"]

[features]
default = []
# The proxy contracts and the manifest format: everything needed to check that a driver
# declares something a controller would accept.
contracts = ["dep:anyhow", "dep:semver", "dep:toml"]
# Building and reading `.junodrv` archives.
pack = ["contracts", "dep:zip"]
# SHA-1, SHA-256 and AES-128-CBC — the primitives behind nearly every LAN device's idea of
# "encrypted", as opposed to a vendor's own protocol. See `crypto` in `src/lib.rs`.
crypto = ["dep:sha1", "dep:sha2", "dep:aes", "dep:cbc"]

[workspace]
